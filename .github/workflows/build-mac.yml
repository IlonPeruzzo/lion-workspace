name: Build Mac

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Least-privilege: o workflow todo e read-only. So o job de publish (em tag) ganha
# contents:write — assim o token de escrita NAO fica exposto durante `npm ci`
# (postinstall de dep maliciosa nao consegue adulterar/publicar release).
permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Mac (arm64 + x64)
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/*.dmg
            dist/*.zip

  publish-mac:
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: dist

      # Publica no repo de RELEASES novo (via PAT RELEASES_TOKEN). continue-on-error:
      # se o PAT nao existir ainda, nao derruba — a ponte abaixo ainda publica.
      - name: Publish to releases repo (novo feed)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (SHA pin — supply-chain)
        continue-on-error: true
        with:
          repository: IlonPeruzzo/lion-workspace-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          files: |
            dist/*.dmg
            dist/*.zip

      # PONTE TEMPORARIA: publica tambem no repo antigo (remover quando todos no v1.5.8+)
      - name: Ponte - publica no repo antigo (temporario)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (SHA pin)
        with:
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
