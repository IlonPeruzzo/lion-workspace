name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Permissao MINIMA por padrao; so o job que publica ganha contents:write.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG + ZIP (Universal)
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # so este job escreve na Release
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      # ── Publica no repo de RELEASES (o feed novo que o v1.5.8+ procura) ──
      # Precisa do secret RELEASES_TOKEN (PAT fine-grained com contents:write no
      # repo lion-workspace-releases). continue-on-error: se o PAT ainda nao foi
      # configurado, NAO derruba o release — a ponte abaixo ainda publica no repo antigo.
      - name: Publish to releases repo (novo feed)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (SHA pin — supply-chain)
        continue-on-error: true
        with:
          repository: IlonPeruzzo/lion-workspace-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

      # ── PONTE TEMPORARIA: publica tambem no repo antigo (lion-workspace), pra quem
      #    ainda esta no v1.5.7 achar o update. REMOVER este step quando todos ja
      #    estiverem no v1.5.8+ (da pra ver a versao de cada um no log do Discord).
      - name: Ponte - publica no repo antigo (temporario)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (SHA pin)
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
